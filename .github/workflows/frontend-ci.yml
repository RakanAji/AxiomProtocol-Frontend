name: Frontend CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_AXIOM_ROUTER_ADDRESS: "0x0000000000000000000000000000000000000000"
          NEXT_PUBLIC_CHAIN_ID: "11155111"
          NEXT_PUBLIC_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"
          NEXT_PUBLIC_PRIVACY_ENABLED: "false"
